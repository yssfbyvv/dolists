<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mening Ilovam</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;padding-bottom:70px}
h2{margin:0 0 12px}section{display:none;padding:16px;max-width:600px;margin:auto}section.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1e293b;border-top:1px solid #334155}
nav button{flex:1;padding:10px 2px;background:none;border:0;color:#94a3b8;font-size:11px}nav button.on{color:#38bdf8;font-weight:700}
nav button b{display:block;font-size:20px}
input,select,textarea,button.b{width:100%;padding:11px;margin:4px 0;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:16px}
button.b{background:#0ea5e9;border:0;font-weight:700}button.r{background:#ef4444}button.g{background:#22c55e}
.card{background:#1e293b;border-radius:12px;padding:12px;margin:8px 0}.row{display:flex;gap:8px}.row>*{flex:1}
.done{text-decoration:line-through;opacity:.6}.sm{font-size:13px;color:#94a3b8}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ck button{padding:16px;font-size:20px;border-radius:12px;border:0;background:#334155;color:#fff}
.ck .o{background:#f59e0b}.ck .e{background:#0ea5e9}
#scr{background:#020617;border-radius:12px;padding:16px;text-align:right;font-size:28px;min-height:70px;word-break:break-all;margin-bottom:10px}
#alarm{display:none;position:fixed;inset:0;background:#000d;z-index:9;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
</style></head><body>

<section id="s0" class="on"><h2>⏰ Kundalik ishlar</h2>
<input id="tt" placeholder="Ish nomi">
<div class="row"><input id="tm" type="time"><select id="tn"><option value="0">🔔 Qo'ng'iroq</option><option value="1">📢 Sirena</option><option value="2">🎵 Melodiya</option><option value="3">🐦 Kuchli beep</option></select></div>
<select id="td"><option value="10">10 soniya</option><option value="30" selected>30 soniya</option><option value="60">1 daqiqa</option><option value="180">3 daqiqa</option></select>
<button class="b" onclick="addT()">Qo'shish</button>
<button class="b g" onclick="beep(+tn.value,2)">🔊 Ovozni tekshirish</button>
<div id="tl"></div></section>

<section id="s1"><h2>🧮 Kalkulyator</h2><div id="scr">0</div>
<div class="ck" id="ck"></div></section>

<section id="s2"><h2>💱 Valyuta</h2>
<input id="ca" type="number" value="1">
<div class="row"><select id="cf"></select><select id="ct"></select></div>
<button class="b" onclick="conv()">Hisoblash</button>
<div class="card" id="cr" style="font-size:20px">—</div>
<details class="card"><summary>Kurslarni tahrirlash (1 birlik = necha UZS)</summary>
<p class="sm">Internet yo'q, shuning uchun kurslarni o'zingiz yangilab turing.</p><div id="rl"></div>
<div class="row"><input id="nc" placeholder="Kod (masalan SOL)"><input id="nv" type="number" placeholder="UZS"></div>
<button class="b" onclick="addC()">Valyuta qo'shish</button></details></section>

<section id="s3"><h2>🌐 Tarjimon</h2>
<input id="tw" placeholder="So'z yozing (uz yoki en)" oninput="tr()">
<div class="card" id="tres">—</div>
<details class="card"><summary>Yangi so'z qo'shish</summary>
<input id="wu" placeholder="O'zbekcha"><input id="we" placeholder="English">
<button class="b" onclick="addW()">Saqlash</button>
<p class="sm" id="wc"></p></details></section>

<section id="s4"><h2>📒 Daftar</h2>
<input id="nt" placeholder="Sarlavha"><textarea id="nb" rows="4" placeholder="Matn..."></textarea>
<button class="b" onclick="addN()">Saqlash</button><div id="nl"></div></section>

<section id="s5"><h2>🎵 Musiqa</h2>
<input id="mf" type="file" accept="audio/*" multiple onchange="addM(this.files)">
<audio id="au" controls style="width:100%;margin:8px 0" onended="nextM()"></audio>
<div id="ml"></div></section>

<nav id="nv2"></nav>
<div id="alarm"><div style="font-size:60px">⏰</div><h1 id="at"></h1>
<button class="b g" style="max-width:300px" onclick="stopA(1)">✅ Bajarildi</button>
<button class="b r" style="max-width:300px" onclick="stopA(0)">🔇 To'xtatish</button></div>

<script>
const $=id=>document.getElementById(id),J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// NAV
['⏰|Ishlar','🧮|Hisob','💱|Valyuta','🌐|Tarjima','📒|Daftar','🎵|Musiqa'].forEach((x,i)=>{const[a,b]=x.split('|');nv2.innerHTML+=`<button onclick="go(${i})"><b>${a}</b>${b}</button>`});
function go(n){document.querySelectorAll('section').forEach((s,i)=>s.classList.toggle('on',i==n));document.querySelectorAll('nav button').forEach((s,i)=>s.classList.toggle('on',i==n))}go(0);
// SOUND
let ac,loop,ringing=null;
function beep(type,times){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();
 const P=[[880,.15,'sine'],[700,.3,'sawtooth'],[523,.2,'triangle'],[1500,.1,'square']][type];
 let t=ac.currentTime;
 for(let i=0;i<(times||1);i++){
  if(type==1){const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.connect(g);g.connect(ac.destination);o.frequency.setValueAtTime(600,t);o.frequency.linearRampToValueAtTime(1100,t+.5);g.gain.value=.3;o.start(t);o.stop(t+.5);t+=.6}
  else if(type==2){[523,659,784,1047].forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.connect(g);g.connect(ac.destination);o.frequency.value=f;g.gain.value=.3;o.start(t);o.stop(t+.18);t+=.2});t+=.3}
  else{for(let k=0;k<3;k++){const o=ac.createOscillator(),g=ac.createGain();o.type=P[2];o.connect(g);g.connect(ac.destination);o.frequency.value=P[0];g.gain.value=.4;o.start(t);o.stop(t+P[1]);t+=P[1]*1.8}t+=.4}
 }}
// TASKS
let T=J('tasks',[]);
function addT(){if(!tt.value||!tm.value)return alert('Ish va vaqtni kiriting');T.push({id:Date.now(),t:tt.value,tm:tm.value,n:+tn.value,d:+td.value,done:0,last:''});S('tasks',T);tt.value='';rT()}
function rT(){tl.innerHTML=T.sort((a,b)=>a.tm>b.tm?1:-1).map(x=>`<div class="card"><div class="${x.done?'done':''}"><b>${esc(x.tm)}</b> — ${esc(x.t)}</div><div class="sm">${x.done?'✅ Bajarilgan':'Kutilmoqda'} · ${x.d}s</div><div class="row">${x.done?`<button class="b" onclick="tg(${x.id})">Qayta</button>`:`<button class="b g" onclick="tg(${x.id})">Bajarildi</button>`}<button class="b r" onclick="dl(${x.id})">O'chirish</button></div></div>`).join('')||'<p class="sm">Hozircha ish yo\'q</p>'}
function tg(i){const x=T.find(a=>a.id==i);x.done=!x.done;S('tasks',T);rT()}
function dl(i){T=T.filter(a=>a.id!=i);S('tasks',T);rT()}
function startA(x){if(ringing)return;ringing=x;at.textContent=x.t;alarm.style.display='flex';let end=Date.now()+x.d*1000;
 const run=()=>{if(!ringing)return;if(Date.now()>=end){stopA(0);return}beep(x.n,1);loop=setTimeout(run,x.n==2?1300:x.n==1?700:1100)};run();
 try{navigator.vibrate&&navigator.vibrate([500,300,500,300,500])}catch(e){}}
function stopA(d){clearTimeout(loop);if(ringing&&d){const x=T.find(a=>a.id==ringing.id);if(x){x.done=1;S('tasks',T);rT()}}ringing=null;alarm.style.display='none';try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
setInterval(()=>{const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),day=n.toDateString();
 T.forEach(x=>{if(!x.done&&x.tm==hm&&x.last!=day){x.last=day;S('tasks',T);startA(x)}})},1000);
rT();
// CALC
let ex='';const keys=['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='];
keys.forEach(k=>{const b=document.createElement('button');b.textContent=k;if('÷×−+'.includes(k))b.className='o';if(k=='=')b.className='e';b.onclick=()=>cp(k);ck.appendChild(b)});
function cp(k){if(k=='C')ex='';else if(k=='⌫')ex=ex.slice(0,-1);else if(k=='='){try{const e=ex.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');if(!/^[0-9+\-*\/.() ]+$/.test(e))throw 0;ex=String(+(Function('return '+e)()).toFixed(10))}catch(e){ex='Xato'}}else{if(ex=='Xato')ex='';ex+=k}scr.textContent=ex||'0'}
// CURRENCY (1 birlik = UZS)
const DR={UZS:1,USD:12100,EUR:13200,GBP:15500,RUB:135,KZT:25,TRY:350,CNY:1700,AED:3300,KRW:9,JPY:80,BTC:800000000,ETH:30000000,USDT:12100,BNB:7000000,TON:60000,SOL:2000000,DOGE:2000};
let R=J('rates',DR);
function rC(){const o=Object.keys(R).map(k=>`<option>${esc(k)}</option>`).join('');const a=cf.value,b=ct.value;cf.innerHTML=ct.innerHTML=o;cf.value=a||'USD';ct.value=b||'UZS';
 rl.innerHTML=Object.keys(R).filter(k=>k!='UZS').map(k=>`<div class="row"><div style="padding-top:14px">1 ${esc(k)}</div><input type="number" value="${R[k]}" onchange="R['${esc(k)}']=+this.value;S('rates',R)"></div>`).join('')}
function conv(){const v=+ca.value,r=v*R[cf.value]/R[ct.value];cr.textContent=`${v} ${cf.value} = ${r.toLocaleString('en',{maximumFractionDigits:r<1?8:2})} ${ct.value}`}
function addC(){const c=nc.value.trim().toUpperCase();if(!c||!+nv.value)return;R[c]=+nv.value;S('rates',R);nc.value=nv.value='';rC()}
rC();
// TRANSLATOR
const D=`salom:hello|xayr:goodbye|rahmat:thank you|iltimos:please|ha:yes|yo'q:no|kechirasiz:sorry|men:I|sen:you|u:he/she|biz:we|ular:they|ism:name|do'st:friend|oila:family|ona:mother|ota:father|aka:older brother|opa:older sister|uka:younger brother|singil:younger sister|bola:child|o'g'il:son|qiz:girl|erkak:man|ayol:woman|uy:house|xona:room|eshik:door|deraza:window|stol:table|stul:chair|kitob:book|daftar:notebook|ruchka:pen|maktab:school|o'qituvchi:teacher|o'quvchi:student|talaba:student|ish:work|vaqt:time|kun:day|tun:night|soat:hour|daqiqa:minute|hafta:week|oy:month|yil:year|bugun:today|ertaga:tomorrow|kecha:yesterday|ertalab:morning|kech:evening|suv:water|non:bread|go'sht:meat|sut:milk|choy:tea|qahva:coffee|meva:fruit|olma:apple|banan:banana|uzum:grape|sabzi:carrot|kartoshka:potato|piyoz:onion|tuxum:egg|guruch:rice|osh:pilaf|shakar:sugar|tuz:salt|ovqat:food|yemoq:eat|ichmoq:drink|uxlamoq:sleep|yurmoq:walk|yugurmoq:run|o'qimoq:read|yozmoq:write|gapirmoq:speak|eshitmoq:hear|ko'rmoq:see|bilmoq:know|xohlamoq:want|sevmoq:love|yaxshi:good|yomon:bad|katta:big|kichik:small|uzun:long|qisqa:short|issiq:hot|sovuq:cold|yangi:new|eski:old|chiroyli:beautiful|tez:fast|sekin:slow|oson:easy|qiyin:difficult|baland:tall|past:low|og'ir:heavy|yengil:light|to'g'ri:correct|xato:mistake|qizil:red|ko'k:blue|yashil:green|sariq:yellow|oq:white|qora:black|bir:one|ikki:two|uch:three|to'rt:four|besh:five|olti:six|yetti:seven|sakkiz:eight|to'qqiz:nine|o'n:ten|yuz:hundred|ming:thousand|shahar:city|qishloq:village|mamlakat:country|yo'l:road|mashina:car|avtobus:bus|poyezd:train|samolyot:airplane|velosiped:bicycle|pul:money|narx:price|do'kon:shop|bozor:market|bank:bank|telefon:phone|kompyuter:computer|internet:internet|dastur:program|o'yin:game|musiqa:music|qo'shiq:song|rasm:picture|kino:movie|quyosh:sun|oy(osmon):moon|yulduz:star|osmon:sky|yer:earth|tog':mountain|daryo:river|dengiz:sea|daraxt:tree|gul:flower|it:dog|mushuk:cat|ot:horse|qush:bird|baliq:fish|sigir:cow|qo'y:sheep|bosh:head|ko'z:eye|quloq:ear|burun:nose|og'iz:mouth|qo'l:hand|oyoq:foot|yurak:heart|salomatlik:health|shifokor:doctor|dori:medicine|kasal:sick|baxt:happiness|muhabbat:love|do'stlik:friendship|haqiqat:truth|savol:question|javob:answer|yordam:help|muammo:problem|fikr:idea|tush:dream|hayot:life|dunyo:world|odam:person|xalq:people|til:language|so'z:word|ingliz tili:English|o'zbek tili:Uzbek|qanday:how|nima:what|kim:who|qayer:where|qachon:when|nega:why|qancha:how much|va:and|lekin:but|yoki:or|chunki:because|bilan:with|uchun:for|ichida:in|ustida:on|ostida:under|yonida:next to|oldida:in front of|orqasida:behind|hozir:now|doim:always|hech qachon:never|ba'zan:sometimes|juda:very|ko'p:many|oz:few|hamma:all|har:every|yana:again|ham:also|xush kelibsiz:welcome|xayrli tong:good morning|xayrli kech:good evening|xayrli tun:good night|yaxshimisiz:how are you|mehmon:guest|sovg'a:gift|bayram:holiday|dars:lesson|imtihon:exam|bilim:knowledge|ilm:science|kuch:power|erkinlik:freedom|tinchlik:peace|urush:war|g'alaba:victory|qo'rqmoq:fear|kulmoq:laugh|yig'lamoq:cry|ishlamoq:work|o'ynamoq:play|kelmoq:come|ketmoq:go|olmoq:take|bermoq:give|ochmoq:open|yopmoq:close|boshlamoq:start|tugatmoq:finish|topmoq:find|yo'qotmoq:lose|sotib olmoq:buy|sotmoq:sell|to'lamoq:pay|o'rganmoq:learn|o'rgatmoq:teach|o'ylamoq:think|esdan chiqarmoq:forget|eslamoq:remember`;
let W=J('words',[]);let dict=D.split('|').map(x=>{const i=x.indexOf(':');return[x.slice(0,i),x.slice(i+1)]}).concat(W);
function tr(){const q=tw.value.trim().toLowerCase();if(!q){tres.textContent='—';return}
 let ex=dict.filter(([u,e])=>u.toLowerCase()==q||e.toLowerCase()==q),pt=dict.filter(([u,e])=>!ex.includes([u,e])&&(u.toLowerCase().includes(q)||e.toLowerCase().includes(q))).slice(0,8);
 if(!ex.length&&q.includes(' ')){const out=q.split(/\s+/).map(w=>{const m=dict.find(([u,e])=>u.toLowerCase()==w||e.toLowerCase()==w);return m?(m[0].toLowerCase()==w?m[1]:m[0]):w}).join(' ');tres.innerHTML=`<b>${esc(out)}</b><div class="sm">So'zma-so'z tarjima</div>`;return}
 const f=ex.map(([u,e])=>{return u.toLowerCase()==q?`<div style="font-size:22px">${esc(e)}</div>`:`<div style="font-size:22px">${esc(u)}</div>`}).join('');
 tres.innerHTML=(f||'<span class="sm">Topilmadi. Pastdan o\'zingiz qo\'shing.</span>')+(pt.length?'<hr><div class="sm">O\'xshash:</div>'+pt.map(([u,e])=>`<div>${esc(u)} — ${esc(e)}</div>`).join(''):'')}
function addW(){if(!wu.value||!we.value)return;W.push([wu.value.trim(),we.value.trim()]);S('words',W);dict.push(W[W.length-1]);wu.value=we.value='';wc.textContent=`Lug'atda ${dict.length} ta so'z`}
wc.textContent=`Lug'atda ${dict.length} ta so'z`;
// NOTES
let N=J('notes',[]);
function addN(){if(!nt.value&&!nb.value)return;N.unshift({id:Date.now(),t:nt.value,b:nb.value,d:new Date().toLocaleString()});S('notes',N);nt.value=nb.value='';rN()}
function rN(){nl.innerHTML=N.map(x=>`<div class="card"><b>${esc(x.t)}</b><div class="sm">${esc(x.d)}</div><div style="white-space:pre-wrap">${esc(x.b)}</div><button class="b r" onclick="N=N.filter(a=>a.id!=${x.id});S('notes',N);rN()">O'chirish</button></div>`).join('')}rN();
// MUSIC (IndexedDB - saqlanib qoladi)
let db,M=[],cur=-1;
const req=indexedDB.open('music',1);req.onupgradeneeded=e=>e.target.result.createObjectStore('s',{keyPath:'id'});
req.onsuccess=e=>{db=e.target.result;ldM()};
function ldM(){db.transaction('s').objectStore('s').getAll().onsuccess=e=>{M=e.target.result;rM()}}
function addM(fs){[...fs].forEach(f=>{db.transaction('s','readwrite').objectStore('s').put({id:Date.now()+Math.random(),name:f.name,blob:f}).transaction.oncomplete=ldM});mf.value=''}
function rM(){ml.innerHTML=M.map((x,i)=>`<div class="card ${i==cur?'':''}"><div style="${i==cur?'color:#38bdf8':''}">${i==cur?'▶ ':''}${esc(x.name)}</div><div class="row"><button class="b" onclick="pl(${i})">▶ Eshitish</button><button class="b r" onclick="rmM(${i})">O'chirish</button></div></div>`).join('')||'<p class="sm">Qo\'shiq yuklang — ular ilovada saqlanib qoladi</p>'}
function pl(i){cur=i;if(au.dataset.u)URL.revokeObjectURL(au.dataset.u);const u=URL.createObjectURL(M[i].blob);au.dataset.u=u;au.src=u;au.play();rM()}
function nextM(){if(M.length)pl((cur+1)%M.length)}
function rmM(i){db.transaction('s','readwrite').objectStore('s').delete(M[i].id).transaction.oncomplete=()=>{if(i==cur){au.pause();cur=-1}ldM()}}
</script></body></html>
